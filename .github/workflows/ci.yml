name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing in this pipeline writes to the repo.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every commit on main
# gets its own run to completion, because scripts/deploy.sh only ships a
# commit whose CI run succeeded.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../scripts
      - name: Check formatting
        run: uv run ruff format --check . ../scripts
      - name: Type-check
        run: uv run mypy . ../scripts
      - name: Test
        run: uv run pytest
      - name: Lint shell scripts
        run: shellcheck ../scripts/*.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check and build
        run: npm run build
